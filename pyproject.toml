[project]
name = "fabmq"
version = "0.1.0"
description = "CLI/SDK for the CockroachDB Backed MQ Design"
authors = [
    {name = "Fabio Ghirardello",email = "ghirardello.fabio@gmail.com"}
]
license = "	Apache-2.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2.9",
    "typer>=0.16.0",
]

[project.scripts]
fabmq = "fabmq.cli:main"

[tool.poetry]
include = [
    { path = "sql/001_initial.sql", format = ["sdist", "wheel"] },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
